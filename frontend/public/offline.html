<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUNA - No Internet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fdfaf3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            color: #333;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        h1 {
            font-size: 24px;
            font-weight: 900;
            color: #1f2937;
            margin: 0 0 10px 0;
        }
        p {
            font-size: 16px;
            color: #6b7280;
            margin: 0 0 30px 0;
            max-width: 80%;
        }
        button {
            background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 100%);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }
        .logo {
            position: absolute;
            top: 30px;
            font-size: 24px;
            font-weight: 900;
            color: #f59e0b;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>
    <div class="logo">MUNA</div>
    <div class="icon">🦖</div>
    <h1>Oops! You're offline.</h1>
    <p>Please check your internet connection and try again to continue shopping for groceries.</p>
    <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
